name: Deploy Cloud Run (Next.js)

on:
  workflow_call:
    inputs:
      service-name:
        description: Cloud Run サービス名
        type: string
        required: true
      source-path:
        description: ソースルート（source モード時のデプロイ対象、image モードで build-context 未指定時のデフォルト）
        type: string
        default: './web'
      region:
        description: Cloud Run リージョン（指定なしなら vars.GCP_REGION を使用）
        type: string
        default: ''
      build-mode:
        description: 'ビルド方式: source (Buildpacks) | image (Dockerfile)'
        type: string
        default: 'source'
      ar-repo:
        description: Artifact Registry リポジトリ名（image モード時に必須）
        type: string
        default: ''
      image-name:
        description: 'イメージ名（image モード時に必須。例: web）'
        type: string
        default: ''
      dockerfile-path:
        description: 'Dockerfile への相対パス（build-context 基準）。空なら docker のデフォルト探索'
        type: string
        default: ''
      build-context:
        description: 'image モード時のビルドコンテキスト。空なら source-path を使用。monorepo で兄弟ディレクトリ参照が必要な場合は "." を指定'
        type: string
        default: ''
      env-vars:
        description: |
          Cloud Run に注入する環境変数（KEY1=VALUE1 改行区切り）。
          deploy-cloudrun の env_vars に渡される。
        type: string
        default: ''
      secrets-yaml:
        description: Secret Manager 注入定義（KEY=secret-name:version 改行区切り）
        type: string
        default: ''
      smoke-path:
        description: スモークテスト対象パス
        type: string
        default: '/'
      smoke-expected-statuses:
        description: スモーク成功と判定する HTTP ステータス（スペース区切り）
        type: string
        default: '200 302 307'
      enable-rollback:
        description: スモーク失敗時に前リビジョンへ rollback するか
        type: boolean
        default: true
      route-to-latest:
        description: デプロイ成功時に latest リビジョンへ 100% トラフィックを向けるか
        type: boolean
        default: true
      colocate-repo:
        description: |
          ビルド前に sibling パスへ配置する外部リポジトリ（owner/repo 形式）。
          image モードで _design-system 等を Docker context に含めたい場合に使用。
        type: string
        default: ''
      colocate-ref:
        description: colocate-repo のチェックアウト ref（タグ・ブランチ・SHA）
        type: string
        default: ''
      colocate-path:
        description: colocate-repo の配置先（GITHUB_WORKSPACE からの相対パス、例 "_design-system"）
        type: string
        default: ''
      build-args:
        description: 'Dockerfile に渡す build-arg（KEY=VALUE 改行区切り、image モードのみ）。機密値の渡し方や具体例は docs/usage-deploy-next.md を参照。'
        type: string
        default: ''
      timeout-minutes:
        description: ジョブのタイムアウト（分）
        type: number
        default: 25
      additional-build-context-repos:
        description: |
          BuildKit additional build contexts として渡す追加 repo の一覧 (image モードのみ)。
          改行区切り。各行 `name=owner/repo[@ref]` 形式。例:
            forms-py=daiwajuki/pdf-forms@main
            ui-design=daiwajuki/daiwajuki-UIdesign@v1.11.0
          指定された各 repo は `./_external/{name}` に shallow clone され、
          `docker build --build-context {name}=./_external/{name}` として渡される。
          private repo を含む場合は external-checkout-app-* もしくは external-checkout-token secret も必要。
          colocate-repo (旧パターン) と併用可能だが、新規利用ではこちらを推奨。
        type: string
        default: ''
    secrets:
      COLOCATE_TOKEN:
        description: |
          colocate-repo がプライベートの場合の PAT。
          優先順: external-checkout-app-* で mint した App token > COLOCATE_TOKEN > github.token。
          v0.11+ から App credentials 経由が推奨。COLOCATE_TOKEN は legacy 互換のため残す。
          secret 名はハイフン不可のため UPPER_SNAKE で命名 (v0.6.0 でリネームすべきだったが
          YAML 反映漏れで v0.10.0 まで silent broken だった経緯あり)。
        required: false
      GH_PACKAGES_TOKEN:
        description: |
          GitHub Packages 読み取り用トークン（org secret 推奨）。
          複数 repo に跨る private packages を npm install するために必要。
          未指定時は secrets.GITHUB_TOKEN にフォールバック（同 repo 内 packages のみ読める）。
          secret 名はハイフン不可のためアンダースコアで命名。
        required: false
      external-checkout-token:
        description: |
          additional-build-context-repos の private repo を clone する直接 token。
          PAT もしくは事前に mint した GitHub App installation token (contents:read 以上)。
          App ID + private key を渡す方式 (推奨) を使う場合は外して下記 2 つを設定。
        required: false
      external-checkout-app-id:
        description: |
          GitHub App ID (数字)。external-checkout-app-private-key と組で使い、
          install token を mint して cross-repo checkout する。
          PAT 方式より権限境界が明確で renewable。指定時は external-checkout-token を上書き。
        required: false
      external-checkout-app-private-key:
        description: |
          GitHub App private key (PEM 全文)。external-checkout-app-id と組で必須。
          install 先 repo + contents:read 権限が必要。
        required: false

# 注: ここでは packages: read を要求しない。reusable workflow の permissions が
# caller の permissions の super-set になると GitHub Actions は startup_failure で
# 0 job のまま即終了するため (v0.6.0〜v0.9.2 で発生した next スタック全採用の事故)。
# GitHub Packages を github.token で読みたい caller は自分の permissions に
# packages: read を足す。PAT (GH_PACKAGES_TOKEN) 利用時は permissions 不要。
# 詳細は docs/usage-deploy-next.md の「caller 側の permissions」セクションを参照。

# Node.js 24 を先取り opt-in (2026-06-02 で強制移行、それ以前に互換性を検証する)。
# v4 actions / v1 (create-github-app-token) の Node 20 ランタイム deprecation 警告に対応。
# 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve region
        id: region
        run: |
          R="${{ inputs.region }}"
          if [ -z "$R" ]; then R="${{ vars.GCP_REGION }}"; fi
          echo "value=$R" >> "$GITHUB_OUTPUT"

      - name: Resolve build context
        id: ctx
        run: |
          C="${{ inputs.build-context }}"
          if [ -z "$C" ]; then C="${{ inputs.source-path }}"; fi
          echo "value=$C" >> "$GITHUB_OUTPUT"

      # ─── App credentials の検出 + token mint (colocate / additional 共有) ───
      # external-checkout-app-id/private-key が渡されていれば installation token を mint し、
      # colocate-repo のチェックアウトと後段の additional-build-context-repos clone で共有利用する。
      # 旧 COLOCATE_TOKEN (PAT) も受理（App 優先、両方未指定なら github.token フォールバック）。
      - name: Detect App credentials presence
        id: has-app
        env:
          APP_ID: ${{ secrets.external-checkout-app-id }}
        shell: bash
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App installation token
        if: steps.has-app.outputs.available == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.external-checkout-app-id }}
          private-key: ${{ secrets.external-checkout-app-private-key }}
          owner: ${{ github.repository_owner }}

      # ─── colocate-repo を build context 配下に配置 ────────────────────────
      - name: Checkout colocate-repo
        if: inputs.colocate-repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.colocate-repo }}
          ref: ${{ inputs.colocate-ref }}
          # 優先順: App-mint token > COLOCATE_TOKEN (PAT) > GITHUB_TOKEN
          token: ${{ steps.app-token.outputs.token || secrets.COLOCATE_TOKEN || github.token }}
          path: ${{ inputs.colocate-path }}

      - name: Validate WIF configuration
        # ★ vars 未設定だと google-github-actions/auth が "Unable to generate
        # OAuth token from environment" を返し、原因が consumer 側で読み解けない。
        # vars.* は env 経由で参照 (shell 直挿しを避ける defense-in-depth)。
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${WIF_PROVIDER:-}" ] || [ -z "${WIF_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::WIF configuration missing. Set the following in repository (or org) variables:"
            echo "  - vars.WIF_PROVIDER          (e.g., projects/123/locations/global/workloadIdentityPools/.../providers/...)"
            echo "  - vars.WIF_SERVICE_ACCOUNT   (e.g., github-deployer@PROJECT.iam.gserviceaccount.com)"
            echo "  - vars.GCP_PROJECT_ID        (e.g., my-gcp-project)"
            echo "  - vars.GCP_REGION (optional) (e.g., asia-northeast2)"
            echo ""
            echo "See _ci-templates/docs/secrets.md for full setup guide."
            exit 1
          fi
          if [ -z "${GCP_PROJECT_ID:-}" ]; then
            echo "::error::vars.GCP_PROJECT_ID is not set"
            exit 1
          fi
          echo "WIF configuration OK"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # ─── image モード: Dockerfile ビルド & push ──────────────────────────
      - name: Configure Docker for Artifact Registry
        if: inputs.build-mode == 'image'
        run: gcloud auth configure-docker ${{ steps.region.outputs.value }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        if: inputs.build-mode == 'image'
        uses: docker/setup-buildx-action@v3

      - name: Validate image-mode inputs
        if: inputs.build-mode == 'image'
        run: |
          if [ -z "${{ inputs.ar-repo }}" ] || [ -z "${{ inputs.image-name }}" ]; then
            echo "::error::build-mode=image requires both 'ar-repo' and 'image-name' inputs"
            exit 1
          fi

      - name: Compute image refs
        if: inputs.build-mode == 'image'
        id: image
        run: |
          BASE="${{ steps.region.outputs.value }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ inputs.ar-repo }}/${{ inputs.image-name }}"
          echo "sha_tag=${BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${BASE}:latest" >> "$GITHUB_OUTPUT"

      # GitHub Packages 認証用トークンは inputs 経由では redact されるため、
      # workflow 内で secrets.GITHUB_TOKEN を直接展開して build-args に prepend する
      - name: Compose build-args with GitHub Packages token
        if: inputs.build-mode == 'image'
        id: build-args
        env:
          USER_BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          {
            echo 'value<<EOF_BUILDARGS'
            echo "GH_PACKAGES_TOKEN=${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
            if [ -n "$USER_BUILD_ARGS" ]; then
              echo "$USER_BUILD_ARGS"
            fi
            echo 'EOF_BUILDARGS'
          } >> "$GITHUB_OUTPUT"

      # ─── BuildKit additional build contexts (オプション) ──────────────────
      # `additional-build-context-repos` 経由で別 repo を build context として注入する。
      # colocate-repo (旧パターン) と共存可能。新規利用ではこちらを推奨。
      # App installation token は上段で mint 済 (colocate-repo と共有)。
      - name: Clone additional repos for build contexts
        if: inputs.build-mode == 'image' && inputs.additional-build-context-repos != ''
        env:
          REPOS: ${{ inputs.additional-build-context-repos }}
          # 優先順: App-mint token > 直接 token > GITHUB_TOKEN (fallback、自 repo only)
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.external-checkout-token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _external
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs || true)"
            [ -z "$line" ] && continue
            name="${line%%=*}"
            spec="${line#*=}"
            repo="${spec%%@*}"
            if [ "$repo" = "$spec" ]; then
              ref="main"
            else
              ref="${spec#*@}"
            fi
            echo "::group::Clone $repo@$ref → _external/$name"
            gh repo clone "$repo" "_external/$name" -- --depth 1 --branch "$ref" --single-branch
            echo "::endgroup::"
          done <<<"$REPOS"

      - name: Compute build-contexts argument
        if: inputs.build-mode == 'image' && inputs.additional-build-context-repos != ''
        id: contexts
        env:
          REPOS: ${{ inputs.additional-build-context-repos }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "$line" | xargs || true)"
              [ -z "$line" ] && continue
              name="${line%%=*}"
              echo "$name=./_external/$name"
            done <<<"$REPOS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: inputs.build-mode == 'image'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.value }}
          file: ${{ inputs.dockerfile-path }}
          build-contexts: ${{ steps.contexts.outputs.value }}
          push: true
          build-args: ${{ steps.build-args.outputs.value }}
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}

      # ─── デプロイ（source / image 共通） ─────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service-name }}
          source: ${{ inputs.build-mode == 'source' && inputs.source-path || '' }}
          image:  ${{ inputs.build-mode == 'image'  && steps.image.outputs.sha_tag || '' }}
          region: ${{ steps.region.outputs.value }}
          env_vars: ${{ inputs.env-vars }}
          secrets: ${{ inputs.secrets-yaml }}

      - name: Route 100% traffic to latest Ready revision
        if: inputs.route-to-latest
        run: |
          # set -e: gcloud / update-traffic 失敗で即 fail。
          # set -o pipefail: gcloud 失敗を「No Ready revision」に化けさせない (gcloud
          # の stderr を直接見せる方が診断性が高い)。
          set -euo pipefail
          # `--to-latest` shifts traffic to whatever the latest deployed revision is,
          # even if that revision is Ready=False. If the latest is broken, gcloud
          # accepts the spec update but Cloud Run silently falls back to the previous
          # Ready revision for actual serving. Worse, the broken spec.traffic value
          # then rejects ALL subsequent update-traffic calls until manually fixed.
          #
          # Real incident: 2026-05-23 ICPCostHub revision 00017 was Ready=False but
          # spec.traffic kept pointing at it, blocking every subsequent deploy's
          # traffic shift until a human ran update-traffic --to-revisions= explicitly.
          #
          # Defence: find the most recent Ready=True revision and route there
          # explicitly. If no Ready revision exists, fail loudly instead of leaving
          # spec.traffic in an unusable state.
          #
          # NOTE: We use jq rather than `gcloud --filter` because gcloud filter
          # expressions do NOT scope both predicates to the same array element.
          # `status.conditions.type=Ready AND status.conditions.status=True` would
          # accept a broken revision (Ready=False, Active=True, ...) because some
          # condition has type=Ready and some other condition has status=True.
          # jq's `any(...; .type=="Ready" and .status=="True")` scopes both
          # predicates to the same element, which is what we actually want.
          LATEST_READY=$(gcloud run revisions list \
            --service="${{ inputs.service-name }}" \
            --region="${{ steps.region.outputs.value }}" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=20 \
            --format=json \
            | jq -r 'map(select(any(.status.conditions[]?; .type=="Ready" and .status=="True"))) | .[0].metadata.name // empty')
          if [ -z "$LATEST_READY" ]; then
            echo "::error::No Ready=True revision found for ${{ inputs.service-name }}; refusing to update traffic"
            exit 1
          fi
          echo "Routing 100% traffic to latest Ready revision: $LATEST_READY"
          gcloud run services update-traffic "${{ inputs.service-name }}" \
            --region="${{ steps.region.outputs.value }}" \
            --to-revisions="${LATEST_READY}=100"

      # ─── スモークテスト ──────────────────────────────────────────────────
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PATH_SMOKE: ${{ inputs.smoke-path }}
          EXPECTED: ${{ inputs.smoke-expected-statuses }}
        # ★ Next.js は SSR コンパイル + Vercel-like runtime 起動で cold start が
        # 重め (10-20s)。旧 5×5s=25s では false-rollback の余地。7×5s=35s に拡張 +
        # --max-time 15 で per-request 上限。
        run: |
          echo "Smoke testing: ${URL}${PATH_SMOKE} (expected: ${EXPECTED})"
          for i in 1 2 3 4 5 6 7; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${URL}${PATH_SMOKE}" || echo "000")
            echo "attempt $i -> HTTP $STATUS"
            for ok in $EXPECTED; do
              if [ "$STATUS" = "$ok" ]; then exit 0; fi
            done
            sleep 5
          done
          echo "::error::Smoke test failed (7 retries, ~35s total)"
          exit 1

      # ─── 失敗時の rollback ──────────────────────────────────────────────
      - name: Rollback on failure
        # `failure()` だけだと WIF validation / auth / build など pre-deploy 段階の
        # 失敗でも rollback が起動し、`gcloud not authenticated` 等のエラーで本来の
        # 失敗原因が埋もれる。さらに新しい broken revision が存在しないのに前世代を
        # 巻き戻すことで無関係なダウンタイムを誘発する恐れがある。
        # `steps.deploy.conclusion == 'success'` で「deploy は通ったが route/smoke で
        # 失敗した」場合のみに限定する。
        if: failure() && inputs.enable-rollback && steps.deploy.conclusion == 'success'
        run: |
          # set -euo pipefail: route 側と同じ理由 (gcloud 失敗を可視化)。
          set -euo pipefail
          echo "::warning::Rolling back ${{ inputs.service-name }} to previous revision"
          # ★ Ready filter なしだと新規 deploy された Ready=False revision を
          # rollback target に拾うリスク (race / 連続失敗時)。
          # jq を使うのは gcloud --filter の AND が配列要素間でスコープされず
          # broken revision (Ready=False, Active=True, ...) を誤って通すため
          # (deploy-time route 側と同じ理由)。Ready=True に絞った newest 順で
          # 2 番目 (= 直前の serving 候補) を取る。
          PREV=$(gcloud run revisions list \
            --service="${{ inputs.service-name }}" \
            --region="${{ steps.region.outputs.value }}" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=20 \
            --format=json \
            | jq -r '[.[] | select(any(.status.conditions[]?; .type=="Ready" and .status=="True"))][1].metadata.name // empty')
          if [ -n "$PREV" ]; then
            gcloud run services update-traffic "${{ inputs.service-name }}" \
              --region="${{ steps.region.outputs.value }}" \
              --to-revisions="${PREV}=100"
            echo "Rolled back to ${PREV} (Ready=True)"
          else
            echo "::error::No Ready=True previous revision found for rollback — service may be left in broken state"
            exit 1
          fi

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## 🚀 Deploy ${{ inputs.service-name }}"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| Service | \`${{ inputs.service-name }}\` |"
            echo "| Mode | \`${{ inputs.build-mode }}\` |"
            echo "| Region | \`${{ steps.region.outputs.value }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
