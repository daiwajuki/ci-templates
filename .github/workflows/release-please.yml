name: release-please

on:
  push:
    branches: [main]

# Node.js 24 を先取り opt-in (2026-06-02 で強制移行、それ以前に互換性を検証する)。
# 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write
  # release-please 自身は使わないが、notify-adopters ジョブの `gh workflow run` に
  # actions:write が必要 (workflow_dispatch を API で trigger する権限)。
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  update-floating-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move floating major tag to released commit
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release-please は v{MAJOR}.{MINOR}.{PATCH} タグを既に作成済み
          # こちらは floating major タグ v{MAJOR} を同じコミットに force 移動する
          FLOATING_TAG="v${MAJOR}"
          echo "Moving ${FLOATING_TAG} to ${TAG_NAME}"
          git tag -f -a "${FLOATING_TAG}" -m "floating tag: latest v${MAJOR}.x" "${TAG_NAME}"
          git push origin "${FLOATING_TAG}" --force

  # ─── release: published イベントは GITHUB_TOKEN 作成の Release では他 workflow を ───
  # トリガしない GH Actions の仕様 (v0.9.0〜v0.9.3 で notify-adopters が一度も発火し
  # ていないことを 2026-05-26 に確認)。workflow_dispatch は GITHUB_TOKEN-triggers の
  # 例外として明示的に許可されているので、release-please から `gh workflow run` で
  # notify-adopters.yml を直接呼ぶブリッジを置く。
  notify-adopters:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch notify-adopters for the released tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Dispatching notify-adopters.yml for ${TAG_NAME}"
          gh workflow run notify-adopters.yml \
            --repo "${{ github.repository }}" \
            --field release_tag="${TAG_NAME}" \
            --field dry_run=false
