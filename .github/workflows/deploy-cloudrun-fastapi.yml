name: Deploy Cloud Run (FastAPI / Python)

on:
  workflow_call:
    inputs:
      service-name:
        description: Cloud Run サービス名
        type: string
        required: true
      source-path:
        description: Dockerfile を含むビルドコンテキスト
        type: string
        required: true
      ar-repo:
        description: Artifact Registry リポジトリ名
        type: string
        required: true
      image-name:
        description: 'イメージ名（例: api, scraper）'
        type: string
        required: true
      region:
        description: Cloud Run リージョン（指定なしなら vars.GCP_REGION を使用）
        type: string
        default: ''
      env-vars:
        description: |
          Cloud Run に注入する環境変数（KEY1=VALUE1 改行区切り）。
          deploy-cloudrun の env_vars に渡される。
        type: string
        default: ''
      secrets-yaml:
        description: Secret Manager 注入定義（KEY=secret-name:version 改行区切り）
        type: string
        default: ''
      smoke-paths:
        description: |
          スモークテストするパスのスペース区切りリスト。
          順次試行し、200/307 が一つでも返れば成功。404 は「サーバ起動済み・ルート未定義」として無視。
        type: string
        default: '/health /healthz / /docs'
      enable-rollback:
        description: スモーク失敗時に前リビジョンへ rollback するか
        type: boolean
        default: true
      route-to-latest:
        description: デプロイ成功時に latest リビジョンへ 100% トラフィックを向けるか
        type: boolean
        default: true
      timeout-minutes:
        description: ジョブのタイムアウト（分）
        type: number
        default: 25
      additional-build-context-repos:
        description: |
          BuildKit additional build contexts として渡す追加 repo の一覧。
          改行区切り。各行 `name=owner/repo[@ref]` 形式。例:
            forms-py=daiwajuki/pdf-forms@main
            shared-py=daiwajuki/python-shared@v1.2.0
          指定された各 repo は `./_external/{name}` に shallow clone され、
          `docker build --build-context {name}=./_external/{name}` として渡される。
          private repo を含む場合は external-checkout-app-* もしくは external-checkout-token secret も必要。
        type: string
        default: ''
    secrets:
      external-checkout-token:
        description: |
          additional-build-context-repos の private repo を clone する直接 token。
          PAT もしくは事前に mint した GitHub App installation token (contents:read 以上)。
          App ID + private key を渡す方式 (推奨) を使う場合は外して下記 2 つを設定。
        required: false
      external-checkout-app-id:
        description: |
          GitHub App ID (数字)。external-checkout-app-private-key と組で使い、
          install token を mint して cross-repo checkout する。
          PAT 方式より権限境界が明確で renewable。指定時は external-checkout-token を上書き。
        required: false
      external-checkout-app-private-key:
        description: |
          GitHub App private key (PEM 全文)。external-checkout-app-id と組で必須。
          install 先 repo + contents:read 権限が必要。
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve region
        id: region
        run: |
          R="${{ inputs.region }}"
          if [ -z "$R" ]; then R="${{ vars.GCP_REGION }}"; fi
          echo "value=$R" >> "$GITHUB_OUTPUT"

      - name: Validate WIF configuration
        # ★ vars 未設定だと google-github-actions/auth が "Unable to generate
        # OAuth token from environment" を返し、原因が consumer 側で読み解けない。
        run: |
          if [ -z "${{ vars.WIF_PROVIDER }}" ] || [ -z "${{ vars.WIF_SERVICE_ACCOUNT }}" ]; then
            echo "::error::WIF configuration missing. Set the following in repository (or org) variables:"
            echo "  - vars.WIF_PROVIDER          (e.g., projects/123/locations/global/workloadIdentityPools/.../providers/...)"
            echo "  - vars.WIF_SERVICE_ACCOUNT   (e.g., github-deployer@PROJECT.iam.gserviceaccount.com)"
            echo "  - vars.GCP_PROJECT_ID        (e.g., my-gcp-project)"
            echo "  - vars.GCP_REGION (optional) (e.g., asia-northeast2)"
            echo ""
            echo "See _ci-templates/docs/secrets.md for full setup guide."
            exit 1
          fi
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::vars.GCP_PROJECT_ID is not set"
            exit 1
          fi
          echo "WIF configuration OK"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ steps.region.outputs.value }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image refs
        id: image
        run: |
          BASE="${{ steps.region.outputs.value }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ inputs.ar-repo }}/${{ inputs.image-name }}"
          echo "sha_tag=${BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${BASE}:latest" >> "$GITHUB_OUTPUT"

      # ─── BuildKit additional build contexts (オプション) ──────────────────
      # `additional-build-context-repos` 経由で別 repo を build context として注入する。
      # 例: ICPForms backend に `daiwajuki/pdf-forms` の forms-py パッケージを
      # 同梱して embedded PDF 生成 (ADR 0020 — _pdf-forms 配給パターン)。

      # GitHub App credentials の有無を env 経由で判定 (actionlint: secrets.X は if: で
      # 直接参照不可なので、env に export してから出力 step で boolean 化)
      - name: Detect App credentials presence
        if: inputs.additional-build-context-repos != ''
        id: has-app
        env:
          APP_ID: ${{ secrets.external-checkout-app-id }}
        shell: bash
        run: |
          if [ -n "$APP_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # App credentials が渡されていれば install token を mint。短命 (1h) で renewable。
      - name: Generate GitHub App installation token
        if: steps.has-app.outputs.available == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.external-checkout-app-id }}
          private-key: ${{ secrets.external-checkout-app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Clone additional repos for build contexts
        if: inputs.additional-build-context-repos != ''
        env:
          REPOS: ${{ inputs.additional-build-context-repos }}
          # 優先順: App-mint token > 直接 token > GITHUB_TOKEN (fallback、自 repo only)
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.external-checkout-token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _external
          while IFS= read -r line; do
            line="${line%%#*}"  # 行内コメント除去
            line="$(echo "$line" | xargs || true)"  # 前後空白 trim
            [ -z "$line" ] && continue
            name="${line%%=*}"
            spec="${line#*=}"
            repo="${spec%%@*}"
            if [ "$repo" = "$spec" ]; then
              ref="main"
            else
              ref="${spec#*@}"
            fi
            echo "::group::Clone $repo@$ref → _external/$name"
            gh repo clone "$repo" "_external/$name" -- --depth 1 --branch "$ref" --single-branch
            echo "::endgroup::"
          done <<<"$REPOS"

      - name: Compute build-contexts argument
        if: inputs.additional-build-context-repos != ''
        id: contexts
        env:
          REPOS: ${{ inputs.additional-build-context-repos }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            while IFS= read -r line; do
              line="${line%%#*}"
              line="$(echo "$line" | xargs || true)"
              [ -z "$line" ] && continue
              name="${line%%=*}"
              echo "$name=./_external/$name"
            done <<<"$REPOS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.source-path }}
          build-contexts: ${{ steps.contexts.outputs.value }}
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.latest_tag }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service-name }}
          image: ${{ steps.image.outputs.sha_tag }}
          region: ${{ steps.region.outputs.value }}
          env_vars: ${{ inputs.env-vars }}
          secrets: ${{ inputs.secrets-yaml }}

      - name: Route 100% traffic to latest Ready revision
        if: inputs.route-to-latest
        run: |
          # `--to-latest` shifts traffic to whatever the latest deployed revision is,
          # even if that revision is Ready=False. If the latest is broken, gcloud
          # accepts the spec update but Cloud Run silently falls back to the previous
          # Ready revision for actual serving. Worse, the broken spec.traffic value
          # then rejects ALL subsequent update-traffic calls until manually fixed.
          #
          # Real incident: 2026-05-23 ICPCostHub revision 00017 was Ready=False but
          # spec.traffic kept pointing at it, blocking every subsequent deploy's
          # traffic shift until a human ran update-traffic --to-revisions= explicitly.
          #
          # Defence: find the most recent Ready=True revision and route there
          # explicitly. If no Ready revision exists, fail loudly instead of leaving
          # spec.traffic in an unusable state.
          #
          # NOTE: We use jq rather than `gcloud --filter` because gcloud filter
          # expressions do NOT scope both predicates to the same array element.
          # `status.conditions.type=Ready AND status.conditions.status=True` would
          # accept a broken revision (Ready=False, Active=True, ...) because some
          # condition has type=Ready and some other condition has status=True.
          # jq's `any(...; .type=="Ready" and .status=="True")` scopes both
          # predicates to the same element, which is what we actually want.
          LATEST_READY=$(gcloud run revisions list \
            --service="${{ inputs.service-name }}" \
            --region="${{ steps.region.outputs.value }}" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=20 \
            --format=json \
            | jq -r 'map(select(any(.status.conditions[]?; .type=="Ready" and .status=="True"))) | .[0].metadata.name // empty')
          if [ -z "$LATEST_READY" ]; then
            echo "::error::No Ready=True revision found for ${{ inputs.service-name }}; refusing to update traffic"
            exit 1
          fi
          echo "Routing 100% traffic to latest Ready revision: $LATEST_READY"
          gcloud run services update-traffic "${{ inputs.service-name }}" \
            --region="${{ steps.region.outputs.value }}" \
            --to-revisions="${LATEST_READY}=100"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PATHS: ${{ inputs.smoke-paths }}
        # ★ cold start 余裕を 3×5s=15s → 5×5s=25s に拡張 + --max-time 15。
        # FastAPI は Laravel より起動軽いが、Vertex AI / DB 接続初期化を含むと
        # 数十秒かかるケースがある (BidFlow 等)。
        run: |
          for path in $PATHS; do
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${URL}${path}" || echo "000")
              echo "${path} attempt $i -> HTTP $STATUS"
              # 200 / 307 は成功
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ]; then
                echo "Smoke OK on ${path}"
                exit 0
              fi
              # 404 は「サーバ起動済み・ルート未定義」として次パスへ
              if [ "$STATUS" = "404" ]; then break; fi
              sleep 5
            done
          done
          echo "::error::Smoke test failed on all paths."
          exit 1

      - name: Rollback on failure
        # `failure()` だけだと WIF validation / auth / build など pre-deploy 段階の
        # 失敗でも rollback が起動し、`gcloud not authenticated` 等のエラーで本来の
        # 失敗原因が埋もれる。さらに新しい broken revision が存在しないのに前世代を
        # 巻き戻すことで無関係なダウンタイムを誘発する恐れがある。
        # `steps.deploy.conclusion == 'success'` で「deploy は通ったが route/smoke で
        # 失敗した」場合のみに限定する。
        if: failure() && inputs.enable-rollback && steps.deploy.conclusion == 'success'
        run: |
          echo "::warning::Rolling back ${{ inputs.service-name }} to previous revision"
          # ★ Ready filter なしだと新規 deploy された Ready=False revision を
          # rollback target に拾うリスク (race / 連続失敗時)。
          # jq を使うのは gcloud --filter の AND が配列要素間でスコープされず
          # broken revision (Ready=False, Active=True, ...) を誤って通すため
          # (deploy-time route 側と同じ理由)。Ready=True に絞った newest 順で
          # 2 番目 (= 直前の serving 候補) を取る。
          PREV=$(gcloud run revisions list \
            --service="${{ inputs.service-name }}" \
            --region="${{ steps.region.outputs.value }}" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=20 \
            --format=json \
            | jq -r '[.[] | select(any(.status.conditions[]?; .type=="Ready" and .status=="True"))][1].metadata.name // empty')
          if [ -n "$PREV" ]; then
            gcloud run services update-traffic "${{ inputs.service-name }}" \
              --region="${{ steps.region.outputs.value }}" \
              --to-revisions="${PREV}=100"
            echo "Rolled back to ${PREV} (Ready=True)"
          else
            echo "::error::No Ready=True previous revision found for rollback — service may be left in broken state"
            exit 1
          fi

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## 🚀 Deploy ${{ inputs.service-name }}"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| Service | \`${{ inputs.service-name }}\` |"
            echo "| Image | \`${{ steps.image.outputs.sha_tag }}\` |"
            echo "| Region | \`${{ steps.region.outputs.value }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
