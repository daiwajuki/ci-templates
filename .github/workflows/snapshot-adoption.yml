name: Snapshot Adoption (nightly) — DEPRECATED

# ⚠️ 2026-05-24: この workflow は _tools/.github/workflows/snapshot-adoption.yml に移管されました。
# projects-meta.json は _tools/data/projects-meta.json が正本（daiwajuki/tools リポ）。
# 本ファイルはテンプレ参照用に残置。実 nightly 実行は daiwajuki/tools で行われます。

on:
  workflow_dispatch:   # 手動実行のみ（cron 停止）

permissions:
  contents: read

jobs:
  snapshot:
    name: Build adoption snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout _ci-templates
        uses: actions/checkout@v4

      - name: Notice — moved to daiwajuki/tools
        run: |
          echo "::warning::This workflow is deprecated. Run snapshot-adoption in daiwajuki/tools instead."
          echo "::warning::projects-meta.json の正本は _tools/data/projects-meta.json です。"
          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build adoption snapshot
        env:
          GH_TOKEN: ${{ secrets.ADOPTER_NOTIFY_TOKEN || github.token }}
        run: |
          mkdir -p .artifacts
          node scripts/build-adoption-snapshot.mjs --remote --json-out=.artifacts/adoption-snapshot.json

      - name: Upload snapshot JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adoption-snapshot-${{ github.run_id }}
          path: .artifacts/adoption-snapshot.json
          retention-days: 30
