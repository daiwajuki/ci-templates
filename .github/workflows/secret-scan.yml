name: Secret scan (gitleaks)

# 採用側で reusable workflow として呼ぶ秘密情報スキャン。
# gitleaks-action@v2 は org（daiwajuki）配下で `GITLEAKS_LICENSE` secret を要求するため使わず、
# gitleaks CLI を直接 DL・実行する（ライセンス不要）。
# 各プロジェクトの ci.yml に gitleaks step を直書きする重複を解消する。

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks CLI のバージョン（GitHub Releases のタグから v を除いた値）
        type: string
        default: '8.21.2'
      config-path:
        description: |
          .gitleaks.toml 等の設定ファイルパス（リポジトリルートからの相対）。
          空なら gitleaks デフォルトルールを使用。リポジトリ直下に .gitleaks.toml があれば
          gitleaks が自動採用するため通常は未指定で良い。
        type: string
        default: ''
      fetch-depth:
        description: |
          checkout の fetch-depth。0 で全 git 履歴をスキャン（過去 commit の漏洩も検出）。
          1 にすると working tree のみ（高速だが履歴は見ない）。
        type: number
        default: 0
      extra-args:
        description: |
          gitleaks detect に渡す追加引数。
          例: --log-opts=--since=2024-01-01
        type: string
        default: ''

# Node.js 24 を先取り opt-in (2026-06-02 で強制移行、それ以前に互換性を検証する)。
# 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# caller の super-set にしない（startup_failure 回避）。履歴 checkout に必要な read のみ。
permissions:
  contents: read

jobs:
  gitleaks:
    name: Run gitleaks (license-free CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          CONFIG_PATH: ${{ inputs.config-path }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          set -euo pipefail

          echo "🔍 gitleaks v${GITLEAKS_VERSION} を取得"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL "$url" | tar -xz gitleaks
          chmod +x ./gitleaks

          args=(detect --source=. --redact --no-banner --exit-code=1)
          if [ -n "$CONFIG_PATH" ]; then
            args+=(--config="$CONFIG_PATH")
          fi
          if [ -n "$EXTRA_ARGS" ]; then
            # shellcheck disable=SC2206
            args+=($EXTRA_ARGS)
          fi

          echo "🛡️ gitleaks ${args[*]}"
          if ./gitleaks "${args[@]}"; then
            {
              echo "## ✅ Secret scan (gitleaks) OK"
              echo ""
              echo "漏洩の疑いがある秘密情報は検出されませんでした。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ Secret scan (gitleaks) 検出"
              echo ""
              echo "秘密情報の疑いがある内容が検出されました。上の step ログ（redact 済み）で該当箇所を確認してください。"
              echo ""
              echo "### 対応方法"
              echo ""
              echo "1. 検出値が**実在の秘密**なら、まず該当トークン／鍵を**即ローテーション**する（履歴に残るため revert だけでは不十分）。"
              echo "2. 値をコードから除去し、\`.env\` / Secret Manager 経由参照へ移す。"
              echo "3. **誤検知**なら、リポジトリ直下の \`.gitleaks.toml\` に allowlist を追加する（\`config-path\` 入力でパス指定も可）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
