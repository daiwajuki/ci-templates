name: Self-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-workflows:
    name: actionlint (all workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        # shellcheck severity はデフォルト（style 以上）。SC2086 等を含む全 finding を error 扱いし、
        # 防御的クォート漏れの再発を防ぐ。
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  test-ci-next:
    name: Test ci-next.yml (minimal fixture)
    needs: lint-workflows
    uses: ./.github/workflows/ci-next.yml
    with:
      working-directory: fixtures/minimal-next
      run-lint: true
      run-typecheck: true
      run-build: true
