name: Self-test

on:
  push:
    branches: [main]
  pull_request:

# Node.js 24 を先取り opt-in (2026-06-02 で強制移行、それ以前に互換性を検証する)。
# 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-workflows:
    name: actionlint (all workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        # shellcheck severity はデフォルト（style 以上）。SC2086 等を含む全 finding を error 扱いし、
        # 防御的クォート漏れの再発を防ぐ。
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Validate adopters.json against schema
        # adopters.json は notify-adopters.yml が release: published で読む正本。
        # uses 配列の typo (e.g. "deploy-cloudrun-nextjs") は schema enum で弾く。
        # 新 reusable workflow を足したら schema の enum も同 PR で更新する必要がある。
        run: |
          npx --yes ajv-cli@5 validate \
            --spec=draft2020 \
            -s .github/adopters.schema.json \
            -d .github/adopters.json

  test-ci-next:
    name: Test ci-next.yml (minimal fixture)
    needs: lint-workflows
    uses: ./.github/workflows/ci-next.yml
    with:
      working-directory: fixtures/minimal-next
      run-lint: true
      run-typecheck: true
      run-build: true

  test-ci-laravel:
    name: Test ci-laravel.yml (minimal fixture)
    needs: lint-workflows
    uses: ./.github/workflows/ci-laravel.yml
    with:
      working-directory: fixtures/minimal-laravel
      run-pint: false
      run-tests: false
      env-from-example: false
      cache-composer: false

  test-ci-fastapi:
    name: Test ci-fastapi.yml (minimal fixture)
    needs: lint-workflows
    uses: ./.github/workflows/ci-fastapi.yml
    with:
      working-directory: fixtures/minimal-fastapi
      package-manager: pip
      install-command: 'echo "skip install (self-test fixture)"'
      extra-test-deps: ''
      run-ruff: false
      run-mypy: false
      run-tests: false
