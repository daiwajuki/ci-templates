name: CI (Next.js)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node バージョン（volta フィールドがない場合のフォールバック）
        type: string
        default: '20'
      working-directory:
        description: Next.js プロジェクトルート（monorepo の場合に指定）
        type: string
        default: '.'
      run-lint:
        description: lint ステップを実行するか
        type: boolean
        default: true
      run-typecheck:
        description: typecheck ステップを実行するか
        type: boolean
        default: true
      run-build:
        description: build ステップを実行するか
        type: boolean
        default: true
      run-test:
        description: |
          test ステップ（npm test）を実行するか。
          既存 caller への影響を避けるため既定は false（opt-in）。
          package.json に test スクリプトが無ければ true でもスキップされる。
        type: boolean
        default: false
      run-audit:
        description: |
          npm audit ステップを実行するか。
          既存 caller への影響を避けるため既定は false（opt-in）。
        type: boolean
        default: false
      audit-level:
        description: npm audit --audit-level に渡す最小重要度
        type: string
        default: 'high'
      build-env-file:
        description: ビルド時に .env.local としてコピーする env ファイルのパス（不要なら空）
        type: string
        default: ''
      build-env:
        description: |
          ビルド時に .env.local に追記する KEY=VALUE の複数行文字列。
          build-env-file と併用した場合は build-env が後追記される。
          機密値は呼び出し側で secrets を経由し、build-env-file 経由で渡すこと。
        type: string
        default: ''
      colocate-repo:
        description: |
          lint / typecheck / build 前に外部リポジトリを sibling パスに配置する。
          例: "owner/repo" 形式。
          相対 import が親ディレクトリの兄弟パッケージを参照する構成（_design-system 等）向け。
        type: string
        default: ''
      colocate-ref:
        description: colocate-repo のチェックアウト ref（タグ・ブランチ・SHA）
        type: string
        default: ''
      colocate-path:
        description: |
          colocate-repo の配置先（GITHUB_WORKSPACE からの相対パス）。
          例: "../_design-system" で workspace の親ディレクトリに兄弟配置。
        type: string
        default: ''
    secrets:
      GH_PACKAGES_TOKEN:
        description: GitHub Packages 読み取り用トークン（org secret。未指定時は github.token で試行）
        required: false
      COLOCATE_TOKEN:
        description: colocate-repo がプライベートの場合のアクセストークン（未指定時は external-checkout-app-* で mint した token、それも無ければ github.token）。secret 名はハイフン不可のためアンダースコアで命名。
        required: false
      external-checkout-app-id:
        description: |
          GitHub App ID。external-checkout-app-private-key と組で colocate-repo の
          short-lived installation token を mint する（PAT より権限境界明確 + renewable）。
          COLOCATE_TOKEN より優先。
        required: false
      external-checkout-app-private-key:
        description: GitHub App private key (PEM 全文)。external-checkout-app-id と組で必須。
        required: false

# Node.js 24 を先取り opt-in (2026-06-02 で強制移行、それ以前に互換性を検証する)。
# v4 actions (checkout/setup-node/cache/upload-artifact) と v1 (create-github-app-token)
# が Node 20 ランタイムで動いている deprecation 警告に対応。
# 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── App credentials が指定されていれば installation token を mint ────────
      # COLOCATE_TOKEN PAT 方式と並行サポート（App 優先）。両方未指定なら github.token。
      # Detect/Mint の重複ロジックは mint-app-token composite に集約 (Phase 2)。
      - name: Mint App installation token (colocate)
        if: inputs.colocate-repo != ''
        id: app-token
        uses: daiwajuki/ci-templates/.github/actions/mint-app-token@v0
        with:
          app-id: ${{ secrets.external-checkout-app-id }}
          app-private-key: ${{ secrets.external-checkout-app-private-key }}

      - name: Checkout colocate-repo
        if: inputs.colocate-repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.colocate-repo }}
          ref: ${{ inputs.colocate-ref }}
          # 優先順: App-mint token > COLOCATE_TOKEN (PAT) > GITHUB_TOKEN (同 repo / public のみ)
          token: ${{ steps.app-token.outputs.token || secrets.COLOCATE_TOKEN || github.token }}
          path: __colocate__

      - name: Place colocate-repo at expected path
        if: inputs.colocate-repo != ''
        working-directory: ${{ github.workspace }}
        env:
          COLOCATE_PATH: ${{ inputs.colocate-path }}
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/$COLOCATE_PATH"
          mkdir -p "$(dirname "$dest")"
          rm -rf "$dest"
          cp -r "$GITHUB_WORKSPACE/__colocate__" "$dest"
          rm -rf "$GITHUB_WORKSPACE/__colocate__"

      - name: Setup Node
        uses: daiwajuki/ci-templates/.github/actions/setup-node-volta@v0
        with:
          fallback-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Check scripts
        id: scripts
        run: |
          HAS_LINT=$(node -e "const s=require('./package.json').scripts||{};process.stdout.write(s.lint?'true':'false')")
          HAS_TYPECHECK=$(node -e "const s=require('./package.json').scripts||{};process.stdout.write(s.typecheck?'true':'false')")
          HAS_TEST=$(node -e "const s=require('./package.json').scripts||{};process.stdout.write(s.test?'true':'false')")
          {
            echo "has-lint=$HAS_LINT"
            echo "has-typecheck=$HAS_TYPECHECK"
            echo "has-test=$HAS_TEST"
          } >> "$GITHUB_OUTPUT"

      - name: Lint
        if: inputs.run-lint && steps.scripts.outputs.has-lint == 'true'
        run: npm run lint

      - name: Typecheck
        if: inputs.run-typecheck && steps.scripts.outputs.has-typecheck == 'true'
        run: npm run typecheck

      - name: Test
        if: inputs.run-test && steps.scripts.outputs.has-test == 'true'
        run: npm test

      - name: Audit
        if: inputs.run-audit
        run: npm audit --audit-level="${{ inputs.audit-level }}"

      - name: Copy env file for build
        if: inputs.run-build && inputs.build-env-file != ''
        run: cp "${{ inputs.build-env-file }}" .env.local

      - name: Append build-env vars
        if: inputs.run-build && inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          printf '%s\n' "$BUILD_ENV" >> .env.local

      - name: Build
        if: inputs.run-build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
