name: CI (Next.js)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node バージョン（volta フィールドがない場合のフォールバック）
        type: string
        default: '20'
      working-directory:
        description: Next.js プロジェクトルート（monorepo の場合に指定）
        type: string
        default: '.'
      run-lint:
        description: lint ステップを実行するか
        type: boolean
        default: true
      run-typecheck:
        description: typecheck ステップを実行するか
        type: boolean
        default: true
      run-build:
        description: build ステップを実行するか
        type: boolean
        default: true
      run-test:
        description: |
          test ステップ（npm test）を実行するか。
          既存 caller への影響を避けるため既定は false（opt-in）。
          package.json に test スクリプトが無ければ true でもスキップされる。
        type: boolean
        default: false
      run-audit:
        description: |
          npm audit ステップを実行するか。
          既存 caller への影響を避けるため既定は false（opt-in）。
        type: boolean
        default: false
      audit-level:
        description: npm audit --audit-level に渡す最小重要度
        type: string
        default: 'high'
      audit-omit-dev:
        description: |
          npm audit に --omit=dev を付与し、本番依存のみをゲート対象にするか。
          devDependencies（lint/test 系ツールチェーン）の脆弱性は成果物に同梱されない一方、
          上流が追従するまで非破壊の修正手段が無く、全 PR がブロックされ続けることがある。
          その場合に本番依存の防御を保ったままブロックを解くための opt-in。
          既定は false（従来どおり dev 込みで監査する）。
        type: boolean
        default: false
      audit-fail-on-registry-error:
        description: |
          npm audit が「脆弱性の検出」ではなく「レジストリの audit エンドポイント障害」で
          落ちたときにジョブを失敗させるか。
          既定 false は、3 回リトライしても届かなければ warning を出して監査をスキップする
          （コード側に打つ手が無い障害で全 PR が止まるのを防ぐ）。脆弱性が見つかった場合は
          この値に関係なく従来どおり失敗する。
          true にすると従来どおり障害でも失敗させる（監査を必ず通したい consumer 向け）。
        type: boolean
        default: false
      legacy-peer-deps:
        description: |
          npm ci に --legacy-peer-deps を付与するか。
          Next.js メジャーバージョンを先取りした consumer で next-auth 等の
          peer dependency 宣言が追従しておらず ERESOLVE で落ちるケース向け。
          既定は false（既存 caller への影響なし）。
        type: boolean
        default: false
      build-env-file:
        description: ビルド時に .env.local としてコピーする env ファイルのパス（不要なら空）
        type: string
        default: ''
      build-env:
        description: |
          ビルド時に .env.local に追記する KEY=VALUE の複数行文字列。
          build-env-file と併用した場合は build-env が後追記される。
          機密値は呼び出し側で secrets を経由し、build-env-file 経由で渡すこと。
        type: string
        default: ''
      colocate-repo:
        description: |
          lint / typecheck / build 前に外部リポジトリを sibling パスに配置する。
          例: "owner/repo" 形式。
          相対 import が親ディレクトリの兄弟パッケージを参照する構成（_design-system 等）向け。
        type: string
        default: ''
      colocate-ref:
        description: colocate-repo のチェックアウト ref（タグ・ブランチ・SHA）
        type: string
        default: ''
      colocate-path:
        description: |
          colocate-repo の配置先（GITHUB_WORKSPACE からの相対パス）。
          例: "../_design-system" で workspace の親ディレクトリに兄弟配置。
        type: string
        default: ''
      colocate-repo-2:
        description: |
          2つ目の colocate 対象リポジトリ（"owner/repo" 形式）。
          _auth + _design-system の両方を file: 依存する consumer（14 プロジェクト共通構成）向け。
          未指定なら何もしない（既存 caller への影響なし）。
        type: string
        default: ''
      colocate-ref-2:
        description: colocate-repo-2 のチェックアウト ref（タグ・ブランチ・SHA）
        type: string
        default: ''
      colocate-path-2:
        description: colocate-repo-2 の配置先（GITHUB_WORKSPACE からの相対パス）
        type: string
        default: ''
    secrets:
      GH_PACKAGES_TOKEN:
        description: GitHub Packages 読み取り用トークン（org secret。未指定時は github.token で試行）
        required: false
      COLOCATE_TOKEN:
        description: colocate-repo がプライベートの場合のアクセストークン（未指定時は external-checkout-app-* で mint した token、それも無ければ github.token）。secret 名はハイフン不可のためアンダースコアで命名。
        required: false
      external-checkout-app-id:
        description: |
          GitHub App ID。external-checkout-app-private-key と組で colocate-repo の
          short-lived installation token を mint する（PAT より権限境界明確 + renewable）。
          COLOCATE_TOKEN より優先。
        required: false
      external-checkout-app-private-key:
        description: GitHub App private key (PEM 全文)。external-checkout-app-id と組で必須。
        required: false

# Node.js 24 を先取り opt-in (2026-06-02 で強制移行、それ以前に互換性を検証する)。
# v4 actions (checkout/setup-node/cache/upload-artifact) と v1 (create-github-app-token)
# が Node 20 ランタイムで動いている deprecation 警告に対応。
# 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── App credentials が指定されていれば installation token を mint ────────
      # COLOCATE_TOKEN PAT 方式と並行サポート（App 優先）。両方未指定なら github.token。
      # Detect/Mint の重複ロジックは mint-app-token composite に集約 (Phase 2)。
      - name: Mint App installation token (colocate)
        if: inputs.colocate-repo != '' || inputs.colocate-repo-2 != ''
        id: app-token
        uses: daiwajuki/ci-templates/.github/actions/mint-app-token@v0
        with:
          app-id: ${{ secrets.external-checkout-app-id }}
          app-private-key: ${{ secrets.external-checkout-app-private-key }}

      - name: Checkout colocate-repo
        if: inputs.colocate-repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.colocate-repo }}
          ref: ${{ inputs.colocate-ref }}
          # 優先順: App-mint token > COLOCATE_TOKEN (PAT) > GITHUB_TOKEN (同 repo / public のみ)
          token: ${{ steps.app-token.outputs.token || secrets.COLOCATE_TOKEN || github.token }}
          path: __colocate__

      - name: Place colocate-repo at expected path
        if: inputs.colocate-repo != ''
        working-directory: ${{ github.workspace }}
        env:
          COLOCATE_PATH: ${{ inputs.colocate-path }}
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/$COLOCATE_PATH"
          mkdir -p "$(dirname "$dest")"
          rm -rf "$dest"
          cp -r "$GITHUB_WORKSPACE/__colocate__" "$dest"
          rm -rf "$GITHUB_WORKSPACE/__colocate__"

      # _auth + _design-system の両方が必要な consumer 向け（14 プロジェクト共通構成）。
      # colocate-repo と独立した2本目の checkout/配置（同一トークンを再利用）。
      - name: Checkout colocate-repo-2
        if: inputs.colocate-repo-2 != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.colocate-repo-2 }}
          ref: ${{ inputs.colocate-ref-2 }}
          token: ${{ steps.app-token.outputs.token || secrets.COLOCATE_TOKEN || github.token }}
          path: __colocate2__

      - name: Place colocate-repo-2 at expected path
        if: inputs.colocate-repo-2 != ''
        working-directory: ${{ github.workspace }}
        env:
          COLOCATE_PATH_2: ${{ inputs.colocate-path-2 }}
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/$COLOCATE_PATH_2"
          mkdir -p "$(dirname "$dest")"
          rm -rf "$dest"
          cp -r "$GITHUB_WORKSPACE/__colocate2__" "$dest"
          rm -rf "$GITHUB_WORKSPACE/__colocate2__"

      - name: Setup Node
        uses: daiwajuki/ci-templates/.github/actions/setup-node-volta@v0
        with:
          fallback-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      # colocate-repo は file: 依存として consumer の package.json に載るだけで、
      # npm workspaces ではないため consumer の npm ci では colocate 側自身の
      # 依存関係が解決されない（ローカル開発機では colocate リポジトリが個別に
      # npm install 済みのため気づきにくい）。TS ソースを直接 import する consumer
      # （vitest 等）が colocate 側の import（例: zod, drizzle-orm）を解決できず
      # 落ちるのを防ぐため、package.json があれば個別に依存関係を入れる。
      - name: Install colocate-repo dependencies
        if: inputs.colocate-repo != '' || inputs.colocate-repo-2 != ''
        working-directory: ${{ github.workspace }}
        env:
          COLOCATE_PATH: ${{ inputs.colocate-path }}
          COLOCATE_PATH_2: ${{ inputs.colocate-path-2 }}
        run: |
          set -euo pipefail
          for p in "$COLOCATE_PATH" "$COLOCATE_PATH_2"; do
            [ -z "$p" ] && continue
            dir="$GITHUB_WORKSPACE/$p"
            if [ -f "$dir/package.json" ]; then
              echo "Installing dependencies in $dir"
              (cd "$dir" && npm install --omit=dev --no-audit --no-fund --legacy-peer-deps)
            fi
          done

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund ${{ inputs.legacy-peer-deps && '--legacy-peer-deps' || '' }}
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Check scripts
        id: scripts
        run: |
          HAS_LINT=$(node -e "const s=require('./package.json').scripts||{};process.stdout.write(s.lint?'true':'false')")
          HAS_TYPECHECK=$(node -e "const s=require('./package.json').scripts||{};process.stdout.write(s.typecheck?'true':'false')")
          HAS_TEST=$(node -e "const s=require('./package.json').scripts||{};process.stdout.write(s.test?'true':'false')")
          {
            echo "has-lint=$HAS_LINT"
            echo "has-typecheck=$HAS_TYPECHECK"
            echo "has-test=$HAS_TEST"
          } >> "$GITHUB_OUTPUT"

      - name: Lint
        if: inputs.run-lint && steps.scripts.outputs.has-lint == 'true'
        run: npm run lint

      - name: Typecheck
        if: inputs.run-typecheck && steps.scripts.outputs.has-typecheck == 'true'
        run: npm run typecheck

      - name: Test
        if: inputs.run-test && steps.scripts.outputs.has-test == 'true'
        run: npm test

      # npm audit の失敗は 2 種類ある。「脆弱性が見つかった」は本来のゲートなので落とすが、
      # 「レジストリの audit エンドポイントが応答しない」はコード側に打つ手が無く、
      # そのまま落とすと障害の間すべての PR が止まる（2026-09-04: bulk advisory
      # エンドポイントが断続的に無応答になり、npm 10 が退役済みの legacy quick
      # エンドポイントへフォールバックして 503/400 で落ちた）。
      # 両者は npm CLI が出す固定文言 "audit endpoint returned an error" で見分けられる
      # （lib/utils/audit-error.js。npm 10 / 11 共通）。
      # fetch-timeout は既定 5 分と長く、無応答のまま待つとリトライの意味が無いので短くする。
      - name: Audit
        if: inputs.run-audit
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          AUDIT_OMIT_DEV: ${{ inputs.audit-omit-dev }}
          AUDIT_FAIL_ON_REGISTRY_ERROR: ${{ inputs.audit-fail-on-registry-error }}
        run: |
          set +e
          audit_args=(--audit-level="$AUDIT_LEVEL" --fetch-timeout=30000 --fetch-retries=1)
          if [ "$AUDIT_OMIT_DEV" = "true" ]; then
            audit_args+=(--omit=dev)
          fi
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            out=$(npm audit "${audit_args[@]}" 2>&1)
            code=$?
            echo "$out"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if ! printf '%s' "$out" | grep -q 'audit endpoint returned an error'; then
              # 脆弱性の検出（または想定外のエラー）。従来どおり失敗させる
              exit "$code"
            fi
            echo "::warning::npm audit: レジストリの audit エンドポイントが応答しませんでした（${attempt}/${attempts} 回目）"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep $((attempt * 20))
            fi
          done
          if [ "$AUDIT_FAIL_ON_REGISTRY_ERROR" = "true" ]; then
            echo "::error::npm audit: レジストリの audit エンドポイントに ${attempts} 回失敗しました（audit-fail-on-registry-error: true）"
            exit 1
          fi
          echo "::warning title=npm audit をスキップしました::npm レジストリの audit エンドポイントに ${attempts} 回失敗したため、この run では脆弱性監査を行っていません（コードの問題ではありません）。復旧後の run で再び監査されます"
          exit 0

      - name: Copy env file for build
        if: inputs.run-build && inputs.build-env-file != ''
        run: cp "${{ inputs.build-env-file }}" .env.local

      - name: Append build-env vars
        if: inputs.run-build && inputs.build-env != ''
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          printf '%s\n' "$BUILD_ENV" >> .env.local

      - name: Build
        if: inputs.run-build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
