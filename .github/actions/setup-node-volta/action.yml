name: Setup Node (.node-version / Volta-aware)
description: .node-version（無ければ package.json の volta.node）を尊重して Node をセットアップし npm キャッシュを有効化する

inputs:
  fallback-version:
    description: .node-version も volta フィールドもない場合の Node バージョン
    default: '24'
  working-directory:
    description: .node-version / package.json を探すディレクトリ
    default: '.'

outputs:
  node-version:
    description: セットアップされた Node バージョン
    value: ${{ steps.detect.outputs.version }}

runs:
  using: composite
  steps:
    - name: Detect Node version
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FALLBACK_VERSION: ${{ inputs.fallback-version }}
      # 優先順: working-directory から repo ルートへ遡って最初に見つかった .node-version
      #        → working-directory の package.json の volta.node → fallback-version
      # volta は保守終了（2025-11）のため .node-version へ移行中。volta 読み取りは移行完了まで残す。
      run: |
        VERSION=""
        dir="$PWD"
        while :; do
          if [ -f "$dir/.node-version" ]; then
            VERSION=$(tr -d '[:space:]' < "$dir/.node-version")
            break
          fi
          if [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = "/" ]; then
            break
          fi
          dir=$(dirname "$dir")
        done
        if [ -z "$VERSION" ] && [ -f package.json ]; then
          VERSION=$(node -e "try{const v=require('./package.json').volta?.node;process.stdout.write(v||'')}catch{}" 2>/dev/null)
        fi
        echo "version=${VERSION:-$FALLBACK_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.detect.outputs.version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
